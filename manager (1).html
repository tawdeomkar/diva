<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAFFRON — Manager Login</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4a017; --orange: #ff6b35;
    --deep: #0a0705; --card: #110e09;
    --border: rgba(212,160,23,0.2); --text: #f0e6d3;
    --muted: #8c7a62; --green: #2ecc71; --red: #e74c3c;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--deep); color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden; position: relative;
  }

  /* BG */
  .bg-img {
    position: fixed; inset: 0;
    background: url('https://images.unsplash.com/photo-1601050690597-df0568f70950?w=1800&q=80') center/cover;
    filter: brightness(0.12) saturate(0.4);
    transform: scale(1.06);
    animation: bgDrift 18s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes bgDrift { from { transform:scale(1.06) translateY(0); } to { transform:scale(1.1) translateY(-2%); } }
  .bg-vignette {
    position: fixed; inset: 0; z-index: 1;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(10,7,5,0.85) 100%);
  }

  /* PARTICLES */
  .particles { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .particle {
    position: absolute; border-radius: 50%; background: var(--gold);
    animation: rise linear infinite; opacity: 0;
  }
  @keyframes rise {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.15; }
    100% { transform: translateY(-80px) translateX(var(--dx)); opacity: 0; }
  }

  /* WRAP */
  .login-wrap {
    position: relative; z-index: 10;
    width: 440px; max-width: 95vw;
    animation: wrapReveal 0.9s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes wrapReveal { from { opacity:0; transform:translateY(36px) scale(0.96); } to { opacity:1; transform:translateY(0) scale(1); } }

  /* BRAND TOP */
  .brand-top { text-align: center; margin-bottom: 32px; }
  .brand-ring {
    width: 72px; height: 72px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 1.8rem; margin-bottom: 18px;
    box-shadow: 0 0 0 6px rgba(212,160,23,0.07), 0 0 40px rgba(212,160,23,0.2);
    animation: ringGlow 3s ease-in-out infinite;
  }
  @keyframes ringGlow {
    0%,100% { box-shadow: 0 0 0 6px rgba(212,160,23,0.07), 0 0 30px rgba(212,160,23,0.15); }
    50% { box-shadow: 0 0 0 10px rgba(212,160,23,0.12), 0 0 55px rgba(212,160,23,0.35); }
  }
  .brand-name {
    font-family: 'Cinzel', serif; font-size: 2.2rem; letter-spacing: 7px;
    background: linear-gradient(135deg, #d4a017 0%, #ff6b35 60%, #d4a017 100%);
    background-size: 200%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite;
    display: block; margin-bottom: 5px;
  }
  @keyframes shimmer { 0%{background-position:0%;} 100%{background-position:200%;} }
  .brand-tagline {
    font-size: 0.65rem; letter-spacing: 4px; text-transform: uppercase;
    color: var(--muted);
  }

  /* CARD */
  .login-card {
    background: rgba(17,14,9,0.94);
    border: 1px solid var(--border);
    padding: 38px 36px 32px;
    backdrop-filter: blur(20px);
    position: relative; overflow: hidden;
  }
  .login-card::before {
    content: '';
    position: absolute; top: 0; left: -100%; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--orange), var(--gold), transparent);
    background-size: 300%;
    animation: borderFlow 3s linear infinite;
  }
  @keyframes borderFlow { 0%{background-position:0%;} 100%{background-position:300%;} }
  .login-card::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,160,23,0.2), transparent);
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem; text-align: center; margin-bottom: 4px;
  }
  .card-title em { font-style: italic; color: var(--gold); }
  .card-sub {
    font-size: 0.72rem; letter-spacing: 1.5px; color: var(--muted);
    text-align: center; margin-bottom: 30px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .card-sub::before, .card-sub::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border));
  }
  .card-sub::after { transform: scaleX(-1); }

  /* FORM */
  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block; margin-bottom: 8px;
    font-size: 0.62rem; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold); font-weight: 600;
  }
  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%;
    padding: 13px 46px 13px 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem; letter-spacing: 0.5px;
    outline: none;
    transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
  }
  .input-wrap input::placeholder { color: var(--muted); font-size: 0.9rem; }
  .input-wrap input:focus {
    border-color: var(--gold);
    background: rgba(212,160,23,0.04);
    box-shadow: 0 0 0 3px rgba(212,160,23,0.08);
  }
  .input-wrap input.shake {
    animation: shake 0.4s ease;
    border-color: var(--red);
  }
  @keyframes shake {
    0%,100%{transform:translateX(0);}
    20%,60%{transform:translateX(-5px);}
    40%,80%{transform:translateX(5px);}
  }
  .input-icon {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    font-size: 1rem; pointer-events: none; opacity: 0.35;
  }
  .eye-btn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 1rem; padding: 2px;
    transition: color 0.2s; line-height: 1;
  }
  .eye-btn:hover { color: var(--gold); }

  /* FORGOT */
  .forgot-row {
    text-align: right; margin-top: -10px; margin-bottom: 20px;
  }
  .forgot-link {
    font-size: 0.68rem; letter-spacing: 1.5px; color: var(--muted);
    text-decoration: none; text-transform: uppercase;
    transition: color 0.2s; cursor: pointer; background: none; border: none;
  }
  .forgot-link:hover { color: var(--gold); }

  /* LOGIN BTN */
  .login-btn {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--orange) 100%);
    color: var(--deep); border: none;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.85rem; letter-spacing: 3px; text-transform: uppercase;
    font-weight: 700; cursor: pointer;
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    transition: all 0.3s; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .login-btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    opacity: 0; transition: opacity 0.3s;
  }
  .login-btn:hover::before { opacity: 1; }
  .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(212,160,23,0.38); }
  .login-btn:active { transform: translateY(0); }
  .login-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
  .spin {
    width: 17px; height: 17px;
    border: 2.5px solid rgba(10,7,5,0.25);
    border-top-color: var(--deep);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* MESSAGES */
  .msg {
    display: none; align-items: flex-start; gap: 10px;
    padding: 12px 14px; margin-top: 14px;
    font-size: 0.78rem; letter-spacing: 1px; line-height: 1.5;
    animation: msgIn 0.3s ease;
    border-radius: 0;
  }
  @keyframes msgIn { from{opacity:0;transform:translateY(-8px);} to{opacity:1;transform:translateY(0);} }
  .msg.error { background: rgba(231,76,60,0.08); border: 1px solid rgba(231,76,60,0.28); color: var(--red); }
  .msg.success { background: rgba(46,204,113,0.08); border: 1px solid rgba(46,204,113,0.28); color: var(--green); }
  .msg.info { background: rgba(212,160,23,0.07); border: 1px solid var(--border); color: var(--gold); }
  .msg-icon { font-size: 1rem; flex-shrink: 0; }

  /* DIVIDER */
  .divider {
    display: flex; align-items: center; gap: 14px;
    margin: 22px 0 18px; color: var(--muted);
    font-size: 0.62rem; letter-spacing: 3px; text-transform: uppercase;
  }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }

  /* ALREADY LOGGED */
  .already-wrap {
    display: none; flex-direction: column; align-items: center; gap: 14px;
    padding: 10px 0;
  }
  .already-avatar {
    width: 60px; height: 60px;
    background: linear-gradient(135deg, var(--gold), var(--orange));
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; color: var(--deep); font-weight: 700;
    box-shadow: 0 0 30px rgba(212,160,23,0.3);
  }
  .already-email { color: var(--gold); font-size: 0.9rem; font-weight: 600; }
  .already-status { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--green); }
  .dash-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--gold), var(--orange));
    color: var(--deep); border: none;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.82rem; letter-spacing: 2.5px; text-transform: uppercase;
    font-weight: 700; cursor: pointer;
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    transition: all 0.3s; margin-top: 4px;
  }
  .dash-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(212,160,23,0.35); }
  .signout-btn {
    background: none; border: 1px solid var(--border);
    color: var(--muted); padding: 9px 24px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s;
  }
  .signout-btn:hover { border-color: var(--red); color: var(--red); }

  /* RESET MODAL */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 50; display: none; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
  }
  .modal-bg.open { display: flex; }
  .modal-box {
    background: var(--card); border: 1px solid var(--border);
    width: 360px; max-width: 95vw; padding: 32px;
    animation: modalIn 0.4s cubic-bezier(0.16,1,0.3,1);
    position: relative;
  }
  @keyframes modalIn { from{opacity:0;transform:scale(0.92) translateY(16px);} to{opacity:1;transform:scale(1) translateY(0);} }
  .modal-box h3 { font-family:'Playfair Display',serif; font-size:1.1rem; margin-bottom:8px; }
  .modal-box p { font-size:0.78rem; color:var(--muted); margin-bottom:22px; line-height:1.5; }
  .modal-close {
    position:absolute; top:14px; right:14px;
    background:none; border:1px solid var(--border); color:var(--muted);
    width:28px; height:28px; cursor:pointer; font-size:0.85rem;
    transition:all 0.2s;
  }
  .modal-close:hover { border-color:var(--gold); color:var(--gold); }
  .reset-input {
    width:100%; padding:12px 14px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    color:var(--text); font-family:'Rajdhani',sans-serif; font-size:0.95rem;
    outline:none; margin-bottom:14px;
    transition:border-color 0.2s;
  }
  .reset-input:focus { border-color:var(--gold); }
  .reset-btn {
    width:100%; padding:12px;
    background:linear-gradient(135deg,var(--gold),var(--orange));
    color:var(--deep); border:none;
    font-family:'Rajdhani',sans-serif;
    font-size:0.78rem; letter-spacing:2.5px; text-transform:uppercase;
    font-weight:700; cursor:pointer;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    transition:all 0.25s;
  }
  .reset-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(212,160,23,0.3); }

  /* FOOTER */
  .footer-row {
    text-align: center; margin-top: 18px;
    display: flex; align-items: center; justify-content: center; gap: 20px;
  }
  .footer-link {
    font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); text-decoration: none;
    transition: color 0.2s; cursor: pointer; background:none; border:none;
  }
  .footer-link:hover { color: var(--gold); }
  .footer-sep { color: var(--border); font-size: 0.7rem; }

  /* SECURITY BADGE */
  .security-badge {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 16px;
    font-size: 0.6rem; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--muted);
  }
  .lock-icon { font-size: 0.75rem; }
</style>
</head>
<body>

<div class="bg-img"></div>
<div class="bg-vignette"></div>
<div class="particles" id="particles"></div>

<!-- RESET PASSWORD MODAL -->
<div class="modal-bg" id="resetModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeReset()">✕</button>
    <h3>Reset Password</h3>
    <p>Enter your registered email address. We'll send a password reset link instantly.</p>
    <input type="email" class="reset-input" id="resetEmail" placeholder="admin@saffron.com">
    <button class="reset-btn" onclick="sendReset()">Send Reset Link</button>
    <div class="msg" id="resetMsg" style="margin-top:12px"></div>
  </div>
</div>

<div class="login-wrap">

  <!-- BRAND -->
  <div class="brand-top">
    <div class="brand-ring">👨‍🍳</div>
    <span class="brand-name">SAFFRON</span>
    <span class="brand-tagline">Restaurant · Manager Portal</span>
  </div>

  <!-- CARD -->
  <div class="login-card">

    <!-- LOGIN FORM (shown by default) -->
    <div id="loginSection">
      <div class="card-title">Welcome <em>Back</em></div>
      <div class="card-sub">Authorised Access Only</div>

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <input type="email" id="emailInput" placeholder="admin@saffron.com" autocomplete="email" spellcheck="false">
          <span class="input-icon">✉️</span>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" id="passInput" placeholder="Enter your password" autocomplete="current-password">
          <button class="eye-btn" type="button" id="eyeBtn" onclick="toggleEye()">👁</button>
        </div>
      </div>

      <div class="forgot-row">
        <button class="forgot-link" onclick="openReset()">Forgot password?</button>
      </div>

      <button class="login-btn" id="loginBtn" onclick="doLogin()">
        <span class="spin" id="spinner"></span>
        <span id="loginBtnText">🔐 &nbsp;Sign In to Dashboard</span>
      </button>

      <div class="msg error" id="errorMsg">
        <span class="msg-icon">⚠️</span>
        <span id="errorText"></span>
      </div>
      <div class="msg success" id="successMsg">
        <span class="msg-icon">✅</span>
        <span id="successText"></span>
      </div>
      <div class="msg info" id="infoMsg">
        <span class="msg-icon">ℹ️</span>
        <span id="infoText"></span>
      </div>
    </div>

    <!-- ALREADY LOGGED IN (hidden by default) -->
    <div class="already-wrap" id="alreadySection">
      <div class="already-avatar" id="alreadyAvatar">M</div>
      <div class="already-email" id="alreadyEmail"></div>
      <div class="already-status">✅ &nbsp;Session Active</div>
      <button class="dash-btn" onclick="gotoDash()">Go to Dashboard →</button>
      <button class="signout-btn" onclick="doSignOut()">Sign Out of This Account</button>
    </div>

  </div><!-- end card -->

  <div class="footer-row">
    <a href="index.html" class="footer-link">← Back to Restaurant</a>
    <span class="footer-sep">|</span>
    <span class="footer-link" style="cursor:default">© 2025 Saffron</span>
  </div>

  <div class="security-badge">
    <span class="lock-icon">🔒</span>
    Secured by Firebase Authentication
  </div>

</div>

<!-- Firebase v10 SDK (module) -->
<script type="module">
  import { initializeApp }            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  /* ── Firebase config ── */
  const firebaseConfig = {
    apiKey:            "AIzaSyB5lK3edUOatl-NWKoylSgk46XP7NyoJUs",
    authDomain:        "food-c7abc.firebaseapp.com",
    databaseURL:       "https://food-c7abc-default-rtdb.firebaseio.com",
    projectId:         "food-c7abc",
    storageBucket:     "food-c7abc.firebasestorage.app",
    messagingSenderId: "556941373763",
    appId:             "1:556941373763:web:a5a1f73de91770ff017ff6",
    measurementId:     "G-EEXNEVS1SH"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  /* ── helpers ── */
  const $ = id => document.getElementById(id);

  function clearMsgs() {
    ['errorMsg','successMsg','infoMsg'].forEach(id => $( id).style.display = 'none');
  }
  function showMsg(type, text) {
    clearMsgs();
    const map = { error:'errorMsg', success:'successMsg', info:'infoMsg' };
    const el = $(map[type]);
    el.querySelector('span:last-child').textContent = text;
    el.style.display = 'flex';
  }
  function setLoading(loading) {
    $('loginBtn').disabled = loading;
    $('spinner').style.display = loading ? 'block' : 'none';
    $('loginBtnText').textContent = loading ? 'Verifying…' : '🔐  Sign In to Dashboard';
  }

  /* ── Auth state listener ── */
  onAuthStateChanged(auth, user => {
    if (user) {
      // Show "already logged in" section
      $('loginSection').style.display = 'none';
      const wrap = $('alreadySection');
      wrap.style.display = 'flex';
      $('alreadyEmail').textContent = user.email;
      const initials = user.email.charAt(0).toUpperCase();
      $('alreadyAvatar').textContent = initials;
    } else {
      $('loginSection').style.display = 'block';
      $('alreadySection').style.display = 'none';
    }
  });

  /* ── Login ── */
  window.doLogin = async function () {
    clearMsgs();
    const email = $('emailInput').value.trim();
    const pass  = $('passInput').value;

    if (!email) {
      showMsg('error', 'Please enter your email address.');
      $('emailInput').classList.add('shake');
      setTimeout(() => $('emailInput').classList.remove('shake'), 450);
      return;
    }
    if (!pass) {
      showMsg('error', 'Please enter your password.');
      $('passInput').classList.add('shake');
      setTimeout(() => $('passInput').classList.remove('shake'), 450);
      return;
    }

    setLoading(true);
    try {
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      showMsg('success', `Welcome back, ${cred.user.email}! Redirecting…`);
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
    } catch (err) {
      setLoading(false);
      const msgs = {
        'auth/user-not-found':      'No account found with this email.',
        'auth/wrong-password':      'Incorrect password. Please try again.',
        'auth/invalid-email':       'Please enter a valid email address.',
        'auth/invalid-credential':  'Invalid email or password.',
        'auth/too-many-requests':   'Too many attempts. Account temporarily locked. Try again later.',
        'auth/network-request-failed': 'Network error. Check your internet connection.',
        'auth/user-disabled':       'This account has been disabled. Contact support.',
      };
      showMsg('error', msgs[err.code] || 'Login failed. Please try again.');
      $('passInput').classList.add('shake');
      setTimeout(() => $('passInput').classList.remove('shake'), 450);
    }
  };

  /* ── Sign Out ── */
  window.doSignOut = async function () {
    await signOut(auth);
    clearMsgs();
    showMsg('info', 'Signed out successfully.');
  };

  window.gotoDash = () => { window.location.href = 'dashboard.html'; };

  /* ── Password Reset ── */
  window.sendReset = async function () {
    const email = $('resetEmail').value.trim();
    const msgEl = $('resetMsg');
    msgEl.style.display = 'none';

    if (!email) {
      msgEl.className = 'msg error';
      msgEl.innerHTML = '<span>⚠️</span> Please enter your email address.';
      msgEl.style.display = 'flex';
      return;
    }

    try {
      await sendPasswordResetEmail(auth, email);
      msgEl.className = 'msg success';
      msgEl.innerHTML = `<span>✅</span> Reset link sent to <strong>${email}</strong>. Check your inbox.`;
      msgEl.style.display = 'flex';
      $('resetEmail').value = '';
    } catch (err) {
      msgEl.className = 'msg error';
      const m = {
        'auth/user-not-found':  'No account found with this email.',
        'auth/invalid-email':   'Please enter a valid email address.',
      };
      msgEl.innerHTML = `<span>⚠️</span> ${m[err.code] || 'Failed to send reset email.'}`;
      msgEl.style.display = 'flex';
    }
  };

  /* ── Toggle Eye ── */
  window.toggleEye = function () {
    const inp = $('passInput');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    $('eyeBtn').textContent = inp.type === 'password' ? '👁' : '🙈';
  };

  /* ── Modal ── */
  window.openReset  = () => { $('resetModal').classList.add('open'); $('resetMsg').style.display='none'; };
  window.closeReset = () => { $('resetModal').classList.remove('open'); };

  /* ── Enter key ── */
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if ($('resetModal').classList.contains('open')) sendReset();
      else doLogin();
    }
  });

  /* ── Close modal on bg click ── */
  $('resetModal').addEventListener('click', e => {
    if (e.target === $('resetModal')) closeReset();
  });
</script>

<script>
/* ── Particles ── */
(function () {
  const p = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const d = document.createElement('div');
    d.className = 'particle';
    const s = Math.random() * 3 + 1;
    d.style.cssText = `left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${Math.random()*14+8}s;animation-delay:${Math.random()*10}s;--dx:${(Math.random()-0.5)*70}px`;
    p.appendChild(d);
  }
})();
</script>
</body>
</html>
